name: Terraform Validation

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate-modules:
    name: Validate Modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/aws-aurora-postgresql
          - modules/aws-dynamodb
          - modules/aws-neptune
          - modules/aws-oracle
          - modules/aws-rds-mariadb
          - modules/aws-rds-mysql
          - modules/aws-rds-postgresql
          - modules/aws-rds-sql-server
          - modules/aws-redshift
          - modules/onprem-mysql
          - modules/onprem-postgresql
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.4
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.module }}
      
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.module }}
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.module }}

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/aws-aurora-postgresql
          - examples/aws-dynamodb
          - examples/aws-neptune
          - examples/aws-oracle
          - examples/aws-rds-mariadb
          - examples/aws-rds-mysql
          - examples/aws-rds-postgresql
          - examples/aws-rds-sql-server
          - examples/aws-redshift
          - examples/onprem-mysql
          - examples/onprem-postgresql
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.4
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.example }}
      
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.example }}
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ matrix.example }}

 
