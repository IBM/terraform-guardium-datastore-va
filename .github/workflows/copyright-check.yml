name: Copyright Header Check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check-copyright:
    name: Check Copyright Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check copyright headers in Terraform files
        run: |
          echo "Checking for copyright headers in all Terraform files..."
          
          # Define the expected copyright header pattern
          EXPECTED_HEADER="# Copyright IBM Corp."
          EXPECTED_LICENSE="# SPDX-License-Identifier: Apache-2.0"
          
          # Find all .tf files (excluding .terraform directories and terraform.tfvars files)
          FILES=$(find . -type f -name "*.tf" ! -path "*/.terraform/*" ! -name "terraform.tfvars" ! -name "*.tfvars")
          
          MISSING_COPYRIGHT=()
          MISSING_LICENSE=()
          
          for file in $FILES; do
            # Check if file has copyright header
            if ! head -10 "$file" | grep -q "$EXPECTED_HEADER"; then
              MISSING_COPYRIGHT+=("$file")
            fi
            
            # Check if file has license identifier
            if ! head -10 "$file" | grep -q "$EXPECTED_LICENSE"; then
              MISSING_LICENSE+=("$file")
            fi
          done
          
          # Report results
          if [ ${#MISSING_COPYRIGHT[@]} -gt 0 ] || [ ${#MISSING_LICENSE[@]} -gt 0 ]; then
            echo "❌ Copyright/License header check FAILED"
            echo ""
            
            if [ ${#MISSING_COPYRIGHT[@]} -gt 0 ]; then
              echo "Files missing copyright header:"
              printf '  - %s\n' "${MISSING_COPYRIGHT[@]}"
              echo ""
            fi
            
            if [ ${#MISSING_LICENSE[@]} -gt 0 ]; then
              echo "Files missing license identifier:"
              printf '  - %s\n' "${MISSING_LICENSE[@]}"
              echo ""
            fi
            
            echo "Expected header format:"
            echo "#"
            echo "# Copyright IBM Corp. YYYY"
            echo "# SPDX-License-Identifier: Apache-2.0"
            echo "#"
            echo ""
            
            exit 1
          else
            echo "✓ All Terraform files have proper copyright and license headers"
            exit 0
          fi
      
      - name: Check copyright headers in Python files
        run: |
          echo "Checking for copyright headers in Python files..."
          
          # Find all .py files (excluding .venv, venv, and __pycache__ directories)
          FILES=$(find . -type f -name "*.py" ! -path "*/.venv/*" ! -path "*/venv/*" ! -path "*/__pycache__/*" ! -path "*/.terraform/*")
          
          if [ -z "$FILES" ]; then
            echo "No Python files found, skipping..."
            exit 0
          fi
          
          EXPECTED_HEADER="# Copyright IBM Corp."
          EXPECTED_LICENSE="# SPDX-License-Identifier: Apache-2.0"
          
          MISSING_COPYRIGHT=()
          MISSING_LICENSE=()
          
          for file in $FILES; do
            # Skip empty files
            if [ ! -s "$file" ]; then
              continue
            fi
            
            # Check if file has copyright header
            if ! head -10 "$file" | grep -q "$EXPECTED_HEADER"; then
              MISSING_COPYRIGHT+=("$file")
            fi
            
            # Check if file has license identifier
            if ! head -10 "$file" | grep -q "$EXPECTED_LICENSE"; then
              MISSING_LICENSE+=("$file")
            fi
          done
          
          # Report results
          if [ ${#MISSING_COPYRIGHT[@]} -gt 0 ] || [ ${#MISSING_LICENSE[@]} -gt 0 ]; then
            echo "❌ Copyright/License header check FAILED for Python files"
            echo ""
            
            if [ ${#MISSING_COPYRIGHT[@]} -gt 0 ]; then
              echo "Files missing copyright header:"
              printf '  - %s\n' "${MISSING_COPYRIGHT[@]}"
              echo ""
            fi
            
            if [ ${#MISSING_LICENSE[@]} -gt 0 ]; then
              echo "Files missing license identifier:"
              printf '  - %s\n' "${MISSING_LICENSE[@]}"
              echo ""
            fi
            
            echo "Expected header format:"
            echo "#"
            echo "# Copyright IBM Corp. YYYY"
            echo "# SPDX-License-Identifier: Apache-2.0"
            echo "#"
            echo ""
            
            exit 1
          else
            echo "✓ All Python files have proper copyright and license headers"
            exit 0
          fi

