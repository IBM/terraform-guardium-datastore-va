id: guardium-registration-flow
repo: terraform-guardium-datastore-va
summary: Build and debug Guardium datasource registration flows, templates, and VA module behavior
tags:
  - guardium
  - datasource
  - terraform
  - va
  - api
task_types:
  - module-development
  - datasource-registration
  - api-debug
phases:
  - planner
  - developer
  - qa
  - applier
inputs:
  required_paths:
    - terraform-guardium-datastore-va/modules
    - terraform-guardium-datastore-va/examples
  related_paths:
    - scripts
lessons:
  - terraform-guardium-datastore-va/guardium-api-discovery
  - terraform-guardium-datastore-va/field-ordering-matters
selection_hints:
  triggers:
    keyword_regex:
      - '(?i)guardium'
      - '(?i)datasource'
      - '(?i)template'
      - '(?i)va module'
      - '(?i)registration'
priority: 95

